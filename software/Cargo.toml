[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Pilha-DS/UIGE"

[workspace.dependencies]
uige-core = { path = "crates/core" }
uige-ui = { path = "crates/ui" }
slint = "1.16"
slint-build = "1.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
